# Optimizer-qualification topology for the native `action_policy_libero_nano` recipe
# (preset A, LIBERO-10). Identical model, data, optimizer hyperparameters, LR
# schedule, clipping and global batch (2048) to examples/toml/sft_config/
# action_policy_libero_10_nano.toml. Only the topology differs: one 8-GPU node
# with a one-dimensional FSDP shard mesh and grad_accum 2 (the experiment config's
# documented "128 x DP8 x grad_accum2 = 2048"), instead of HSDP 2x8 at grad_accum 1.
# The shared eight-bit optimizer supports only one-dimensional FSDP2 meshes; both
# optimizer arms use this same topology. The optimizer arm, seeds, max_iter and
# save cadence are passed as Hydra tail overrides by the launcher.

[job]
task         = "vfm"
experiment   = "action_policy_libero_nano"
project      = "cosmos3_action_libero"
group        = "optimizer_qualification"
name         = "action_policy_libero_10_nano_8gpu"
wandb_mode   = "disabled"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [16000]
warm_up_steps = [500]

[trainer]
max_iter        = 2000
logging_iter    = 10
grad_accum_iter = 2       # global batch = max_samples 128 x shard 8 x 2 = 2048

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 250
