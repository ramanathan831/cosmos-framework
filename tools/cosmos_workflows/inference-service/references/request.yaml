# Concrete native API examples; no job-management envelope is accepted.
reasoner:
  chat:
    model: cosmos
    messages:
    - role: user
      content:
      - type: text
        text: Describe the action.
      - type: video_url
        video_url: {url: /data/clip.mp4}
    max_tokens: 512
    seed: 42
  infer:
    media: [/data/clip.mp4]
    prompt: Describe the action.
    num_frames: 8
    seed: 42
predict:
  base:
    prompt: A robot carefully stacks blocks on a table.
    inference_type: text2world
    num_output_frames: 77
    num_steps: 35
    seed: 42
  conditioned:
    prompt: The scene continues.
    inference_type: video2world
    input_path: /data/clip.mp4
    seed: 42
  multiview:
    sample_path: /data/native-multiview-input.json
