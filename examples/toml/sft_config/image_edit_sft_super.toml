# Generation-module LoRA image-editing SFT for Cosmos3-Super.

[job]
task = "vfm"
experiment = "image_edit_sft_super"
project = "cosmos3"
group = "generator_sft"
name = "image_edit_sft_super"
wandb_mode = "disabled"

[model]
precision = "bfloat16"
lora_enabled = true
lora_rank = 16
lora_alpha = 32
lora_target_modules = "q_proj_moe_gen,k_proj_moe_gen,v_proj_moe_gen,o_proj_moe_gen"

[model.ema]
enabled = false
rate = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree = -1
data_parallel_replicate_degree = 1
context_parallel_shard_degree = 2
cfg_parallel_shard_degree = 1

[model.compile]
enabled = false
compile_dynamic = true

[model.activation_checkpointing]
mode = "full"
save_ops_regex = ["fmha"]
preserve_rng_state = true
determinism_check = "default"

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-4
betas = [0.9, 0.95]
eps = 1.0e-6
fused = true
keys_to_select = ["lora_"]
weight_decay = 0

[scheduler]
cycle_lengths = [1000]
f_max = [1.0]
f_min = [0.0]
f_start = [0.0]
warm_up_steps = [50]
verbosity_interval = 0

[trainer]
grad_accum_iter = 2
logging_iter = 1
max_iter = 1000
max_val_iter = 3
run_validation = true
run_validation_on_start = true
validation_iter = 100

[trainer.callbacks.compile_tokenizer]
enabled = false
compile_after_iterations = 3
warmup_resolutions = ["480"]

[trainer.callbacks.grad_clip]
clip_norm = 0.1
force_finite = true

[trainer.callbacks.tao]
enabled = true
experiment_name = "cosmos3-super-generator-sft"
logging_interval = 1
validation_heartbeat_interval = 1

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 100
keys_to_skip_loading = ["net_ema.", "lora_"]
dcp_async_mode_enabled = false

[data.train]
manifest_path = "${oc.env:DATASET_PATH}/train.jsonl"
width = 848
height = 480
cfg_dropout_rate = 0.1
max_caption_tokens = 4096
dataset_name = "uc3_image_edit_train"

[data.val]
manifest_path = "${oc.env:DATASET_PATH}/val.jsonl"
width = 848
height = 480
cfg_dropout_rate = 0.0
max_caption_tokens = 4096
dataset_name = "uc3_image_edit_val"
