# Full generator-path image-editing SFT for Cosmos3-Edge.

[job]
task = "vfm"
experiment = "image_edit_sft_edge"
project = "cosmos3"
group = "generator_sft"
name = "image_edit_sft_edge"
wandb_mode = "disabled"

[model]
precision = "bfloat16"

[model.ema]
enabled = true
rate = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree = -1
data_parallel_replicate_degree = 1

[model.compile]
enabled = false
compile_dynamic = true

[model.activation_checkpointing]
mode = "full"
save_ops_regex = ["fmha"]
preserve_rng_state = true
determinism_check = "default"

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 1.0e-4
betas = [0.9, 0.95]
eps = 1.0e-6
fused = true
keys_to_select = ["moe_gen", "time_embedder", "vae2llm", "llm2vae", "k_norm_und_for_gen"]
weight_decay = 0

[scheduler]
cycle_lengths = [1000]
f_max = [1.0]
f_min = [0.0]
f_start = [0.0]
warm_up_steps = [50]
verbosity_interval = 0

[trainer]
grad_accum_iter = 2
logging_iter = 1
max_iter = 1000
max_val_iter = 3
run_validation = true
run_validation_on_start = true
validation_iter = 100

[trainer.callbacks.compile_tokenizer]
enabled = false
compile_after_iterations = 3

[trainer.callbacks.grad_clip]
clip_norm = 0.1
force_finite = true

[trainer.callbacks.tao]
enabled = true
experiment_name = "cosmos3-edge-generator-sft"
logging_interval = 1
validation_heartbeat_interval = 1

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 100
keys_to_skip_loading = ["net_ema."]
dcp_async_mode_enabled = false

[data.train]
manifest_path = "${oc.env:DATASET_PATH}/train.jsonl"
width = 848
height = 480
cfg_dropout_rate = 0.1
max_caption_tokens = 4096
dataset_name = "uc3_image_edit_train"

[data.val]
manifest_path = "${oc.env:DATASET_PATH}/val.jsonl"
width = 848
height = 480
cfg_dropout_rate = 0.0
max_caption_tokens = 4096
dataset_name = "uc3_image_edit_val"
