name: Cosmos skills
on:
  pull_request:
    paths:
      - tools/cosmos_skills/**
      - .agents/skills/**
      - .claude/skills/**
      - .github/workflows/cosmos-skills.yml
  push:
    branches: [main]
    paths:
      - tools/cosmos_skills/**
      - .agents/skills/**
      - .claude/skills/**
      - .github/workflows/cosmos-skills.yml
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/cosmos_skills
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest --confcutdir=. -q
      - run: python scripts/stamp_versions.py --check
